name: Build and JSON tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }} / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [PhaseArray, CudaSolution]
        os: [ubuntu-22.04, ubuntu-24.04, windows-2025]
        configuration: [Release, Debug]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CMake 3.31.4
        run: |
          python -m pip install cmake==3.31.4
          cmake --version

      - name: Install Ubuntu prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config ca-certificates \
            libx11-dev libxrandr-dev libxcursor-dev libudev-dev \
            libfreetype-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth

      - name: Install CUDA 12.9.1
        if: matrix.project == 'CudaSolution'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "cudart", "visual_studio_integration"]' || '["nvcc", "cudart-dev"]' }}
          log-file-suffix: ${{ matrix.os }}-${{ matrix.configuration }}.txt

      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DPHASEARRAY_BUILD_CUDA=${{ matrix.project == 'CudaSolution' && 'ON' || 'OFF' }}
          -DBUILD_SHARED_LIBS=OFF

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -T "${{ matrix.project == 'CudaSolution' && 'host=x64,cuda=12.9' || 'host=x64' }}"
          -DPHASEARRAY_BUILD_CUDA=${{ matrix.project == 'CudaSolution' && 'ON' || 'OFF' }}
          -DBUILD_SHARED_LIBS=OFF

      - name: Build ${{ matrix.project }} on Ubuntu
        if: runner.os == 'Linux'
        run: cmake --build build --target ${{ matrix.project }} --config ${{ matrix.configuration }} --parallel "$(nproc)"

      - name: Build ${{ matrix.project }} on Windows
        if: runner.os == 'Windows'
        run: cmake --build build --target ${{ matrix.project }} --config ${{ matrix.configuration }} --parallel ([Environment]::ProcessorCount)

      - name: Run JSON suite on Ubuntu
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run -a python tests/run_json_tests.py
          --executable build/bin/PhaseArray
          --output-dir build/test-results

      - name: Run JSON suite on Windows
        if: runner.os == 'Windows'
        run: >-
          python tests/run_json_tests.py
          --executable build/bin/${{ matrix.configuration }}/PhaseArray.exe
          --output-dir build/test-results

      - name: Upload test results and configure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build/test-results/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
